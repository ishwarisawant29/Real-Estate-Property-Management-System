{% extends 'base.html' %}{% block title %}Favorites | Heritage Property{% endblock %}{% block content %}<section class="section"><div class="container"><h1 class="fw-bold mb-4">❤️ My Favorites</h1><div class="row g-4">{% for property in properties %}<div class="col-md-6 col-lg-4"><div class="card card-soft p-4 h-100"><h5>{{ property.title }}</h5><div class="price">₹ {{ property.price }}</div><p class="text-muted">📍 {{ property.city }}</p><a class="btn btn-dark" href="{% url 'property_detail' property.pk %}">View</a></div></div>{% empty %}<div class="col-12"><div class="empty">No favorite properties yet.</div></div>{% endfor %}</div></div></section>{% endblock %}
